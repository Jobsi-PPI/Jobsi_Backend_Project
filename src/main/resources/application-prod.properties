# Configuracion de la base de datos para el perfil prod
spring.datasource.url=${BD_URL}
spring.datasource.username=${BD_USERNAME}
spring.datasource.password=${BD_PASSWORD}

# Configuracion especifica para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.escaes=INFO
