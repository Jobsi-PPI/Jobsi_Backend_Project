# =================================================
# DEVELOPMENT PROFILE (dev)
# =================================================
# La base de datos PostgreSQL y el servidor de correo (Mailpit) los levanta
# Testcontainers al ejecutar: mvnw.cmd spring-boot:test-run
# (requiere Docker Desktop). Flyway crea el esquema al arrancar.

# Secreto JWT solo para desarrollo (en prod debe venir de JWT_SECRET)
app.jwt.secret=${JWT_SECRET:dev-secret-jobsi-solo-para-desarrollo-local-32+}

# Admin inicial de desarrollo (sobrescribible con ADMIN_EMAIL / ADMIN_PASSWORD)
app.admin.correo=${ADMIN_EMAIL:admin@jobsi.local}
app.admin.clave=${ADMIN_PASSWORD:Admin12345}
