spring.application.name=jobsy


# ===============================================
# COMMON CONFIGURATION (Applies to all profiles)
# ===============================================

# Perfil activo, por defecto 'dev'.
# Se puede sobrescribir en tiempo de ejecucion.
spring.profiles.active=${SPRING_PROFILE:dev}


# --- JPA / Hibernate ---
# El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${BD_SCHEMA:jobsi}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.default-schema=${BD_SCHEMA:jobsi}
spring.flyway.schemas=${BD_SCHEMA:jobsi}
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# --- Server  ---
spring.datasource.hikari.maximum-pool-size=10
server.port=${SERVER_PORT:8080}

# ============================
# CORS CONFIGURATION
# ============================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# ============================
# HEALTH CHECK (Actuator)
# ============================
# GET /health es publico y solo devuelve {"status":"UP"};
# el detalle (db, disco, correo) solo lo ve un usuario con rol ADMIN
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
# Si se activa, una caida del SMTP marcaria todo el backend como DOWN
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ============================
# JWT
# ============================
# Minimo 32 caracteres (HS256)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================
# ADMIN INICIAL
# ============================
# Si ADMIN_EMAIL o ADMIN_PASSWORD estan vacios no se crea ningun admin
app.admin.documento=${ADMIN_DOCUMENTO:1000000000}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.primer-apellido=${ADMIN_PRIMER_APELLIDO:Jobsi}
app.admin.correo=${ADMIN_EMAIL:}
app.admin.clave=${ADMIN_PASSWORD:}
app.admin.telefono=${ADMIN_TELEFONO:3000000000}
app.admin.fecha-nacimiento=${ADMIN_FECHA_NACIMIENTO:2000-01-01}

# ============================
# CORREO (SMTP)
# ============================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:no-reply@jobsi.local}

# ============================
# RECUPERACION DE CLAVE
# ============================
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION:30}
# URL publica del backend (se usa en el enlace del correo)
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
# URL del frontend (boton "Iniciar sesion" al terminar)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Logging ---
logging.level.org.springframework.security=DEBUG
logging.level.com.escaes=DEBUG
spring.output.ansi.enabled=ALWAYS
logging.level.org.springframework.web=DEBUG
