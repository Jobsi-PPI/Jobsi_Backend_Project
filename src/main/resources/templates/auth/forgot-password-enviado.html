<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Revisa tu correo')}"></head>
<body>
<main class="tarjeta">
    <div th:replace="~{fragments/base :: marca}"></div>
    <h1>Revisa tu correo</h1>
    <p>Si el correo está registrado, recibirás un enlace para restablecer tu contraseña en unos minutos.
        Revisa también la carpeta de spam.</p>
    <a class="boton" th:href="${loginUrl}">Volver a iniciar sesión</a>
    <a class="enlace" th:href="@{/auth/password/forgot}">¿No te llegó? Solicitar otro enlace</a>
</main>
</body>
</html>
