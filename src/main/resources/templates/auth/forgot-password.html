<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Recuperar contraseña')}"></head>
<body>
<main class="tarjeta">
    <div th:replace="~{fragments/base :: marca}"></div>
    <h1>¿Olvidaste tu contraseña?</h1>
    <p>Escribe el correo con el que te registraste y te enviaremos un enlace para crear una nueva.</p>
    <form th:action="@{/auth/password/forgot}" method="post">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" required autocomplete="email" autofocus
               placeholder="tucorreo@ejemplo.com">
        <button class="boton" type="submit">Enviar enlace</button>
    </form>
    <a class="enlace" th:href="${loginUrl}">Volver a iniciar sesión</a>
</main>
</body>
</html>
