<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Nueva contraseña')}"></head>
<body>
<main class="tarjeta">
    <div th:replace="~{fragments/base :: marca}"></div>
    <h1>Crea una nueva contraseña</h1>
    <p>Elige una contraseña que no hayas usado antes.</p>
    <div class="error" th:if="${error}" th:text="${error}" role="alert"></div>
    <form th:action="@{/auth/password/reset}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <label for="clave">Nueva contraseña</label>
        <input id="clave" name="clave" type="password" required autocomplete="new-password" autofocus
               th:attr="minlength=${longitudMinima}">
        <p class="ayuda" th:text="'Mínimo ' + ${longitudMinima} + ' caracteres.'">Mínimo 8 caracteres.</p>
        <label for="confirmacion">Confirmar contraseña</label>
        <input id="confirmacion" name="confirmacion" type="password" required autocomplete="new-password"
               th:attr="minlength=${longitudMinima}">
        <button class="boton" type="submit">Guardar contraseña</button>
    </form>
</main>
</body>
</html>
