version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: jobsy-db
    restart: always
    environment:
      POSTGRES_DB: jobsy
      POSTGRES_USER: jobsy_user
      POSTGRES_PASSWORD: jobsy_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsy_user -d jobsy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura los correos (recuperacion de contrasena). Bandeja web: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: jobsy-mail
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    container_name: jobsy-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILE: prod
      SERVER_PORT: 8080

      BD_URL: jdbc:postgresql://postgres:5432/jobsy
      BD_USERNAME: jobsy_user
      BD_PASSWORD: jobsy_pass
      BD_SCHEMA: jobsi

      CORS_ALLOWED_ORIGINS: "http://localhost:5173"

      # Cambiar en cualquier entorno real (minimo 32 caracteres)
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-jwt-de-al-menos-32-caracteres}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jobsi.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@jobsi.local
      APP_PUBLIC_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

volumes:
  postgres_data:
